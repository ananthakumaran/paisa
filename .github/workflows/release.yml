name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example v0.8.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish Linux desktop, CLI and Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            sqlite3 \
            libsqlite3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - name: Resolve Go module metadata
        run: go mod tidy

      - name: Build frontend
        run: |
          npm ci
          npm run build
          test -d web/static

      - name: Build and bundle Ledger
        run: |
          nix-build ledger.nix
          install -m 0755 ./result/bin/ledger internal/binary/ledger

      - name: Build Linux desktop application
        run: |
          cd desktop
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.3
          wails build -tags webkit2_41
          test -x build/bin/Paisa

      - name: Build Linux CLI
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/paisa-cli .

      - name: Package Debian desktop application
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          fi

          PKG="dist/paisa-desktop"
          cp -a desktop/build/linux "$PKG"
          install -m 0755 desktop/build/bin/Paisa "$PKG/usr/local/bin/Paisa"
          install -m 0644 desktop/build/appicon.png "$PKG/usr/share/icons/hicolor/512x512/apps/paisa.png"

          sed -i "s/^Version:.*/Version: ${VERSION}/" "$PKG/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$PKG" "dist/paisa_${VERSION}_amd64.deb"

      - name: Package Debian CLI
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          fi

          PKG="dist/paisa-cli-package"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/doc/paisa-cli"
          install -m 0755 dist/paisa-cli "$PKG/usr/bin/paisa-cli"
          install -m 0644 COPYING "$PKG/usr/share/doc/paisa-cli/copyright"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: paisa-cli
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Deb426
          Depends: hledger, libc6, libsqlite3-0
          Description: Paisa command-line interface
           Command-line interface for the Paisa personal finance manager.
          EOF
          dpkg-deb --root-owner-group --build "$PKG" "dist/paisa-cli_${VERSION}_amd64.deb"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export Docker image for release download
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.tag }}"
          fi
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > "dist/paisa-docker-image.tar.gz"

      - name: Prepare release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          cat > dist/release-notes.md <<EOF
          ## Downloads

          - **Paisa Desktop (Debian / Ubuntu, amd64):** `paisa_${TAG#v}_amd64.deb`
          - **Paisa CLI (Debian / Ubuntu, amd64):** `paisa-cli_${TAG#v}_amd64.deb`
          - **Docker image archive:** `paisa-docker-image.tar.gz`

          Install either Debian package with `sudo apt install ./PACKAGE.deb`.

          ## Docker image

          The image is also published to GitHub Container Registry:

          `docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}`

          `latest` is updated for each release.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          ASSETS=(dist/paisa_[0-9]*_amd64.deb dist/paisa-cli_*_amd64.deb dist/paisa-docker-image.tar.gz)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Paisa $TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Paisa $TAG" \
              --notes-file dist/release-notes.md
          fi
