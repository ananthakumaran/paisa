name: Desktop Smoke

on:
  schedule:
    # Weekly on Sunday at 02:30 UTC (08:00 IST), plus manual runs.
    - cron: "30 2 * * 0"
  workflow_dispatch:

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: desktop/build/bin/Paisa
          - os: macos-13
            binary: desktop/build/bin/Paisa.app/Contents/MacOS/Paisa
          - os: windows-2022
            binary: desktop/build/bin/Paisa.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ledger sqlite3 libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config xvfb
      - if: runner.os == 'macOS'
        run: brew install ledger sqlite3
      - if: runner.os == 'Windows'
        run: choco install ledger sqlite
      - run: deno install
      - run: deno task build
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        working-directory: desktop
        run: wails build -tags webkit2_40
      - name: Build desktop app
        if: runner.os != 'Linux'
        working-directory: desktop
        run: wails build
      - name: Smoke-test Linux app
        if: runner.os == 'Linux'
        env:
          PAISA_DESKTOP_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: xvfb-run -a deno task test:desktop
      - name: Smoke-test desktop app
        if: runner.os != 'Linux'
        env:
          PAISA_DESKTOP_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
        run: deno task test:desktop
