journal_path: main.ledger
db_path: paisa.db
ledger_cli: ledger

# Explicit account kinds keep the regression Investment Timeline and
# Allocation tree meaningful after M1-E: without these, the fixture's
# generic `Assets:Equity:*` names would fall through to `unknown` and be
# excluded from the investment whitelist.
accounts:
  - name: Assets:Checking
    kind: bank_current
  - name: Assets:Dollar
    kind: foreign_currency
  - name: Assets:Equity:AAPL
    kind: stock
  - name: Assets:Equity:ABNB
    kind: stock
  - name: Assets:Equity:NIFTY
    kind: mutual_fund
